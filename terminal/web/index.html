<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#031207">
<title>Koodisampo Terminal</title>
<link rel="icon" href="data:,">
<style>
  /* Tämä tyylitiedosto koskee vain kehystä: kanvaasia ja CRT-pintaa sen päällä.
     Itse ruudun asettelee EVG (terminal/KoodisampoTerminal.rgr) ja piirtää
     WebGL (vendor/evg-webgl.js). */
  @font-face {
    font-family: "VT323";
    src: url("./fonts/VT323-Regular.ttf") format("truetype");
    font-display: block;
  }
  :root { --glow: rgba(65, 255, 112, .55); --bg: #031207 }
  html[data-theme="amber"] { --glow: rgba(255, 176, 0, .55); --bg: #140b02 }
  html[data-theme="white"] { --glow: rgba(210, 225, 255, .45); --bg: #0a0d14 }
  * { box-sizing: border-box }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); overscroll-behavior: none;
  }
  body { font: 16px "VT323", monospace; color: #41ff70 }
  #screen {
    position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
    touch-action: manipulation; cursor: text;
    filter: drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 12px var(--glow));
  }
  /* Juovat, reunojen tummuus ja hento välke — kuva putkinäytön läpi. */
  #crt { position: fixed; inset: 0; pointer-events: none }
  #crt::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, .28) 3px, rgba(0, 0, 0, 0) 4px);
    animation: flicker 6s infinite steps(60);
  }
  #crt::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center,
      rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, .45) 88%, rgba(0, 0, 0, .8) 100%);
  }
  @keyframes flicker {
    0%, 100% { opacity: .95 } 12% { opacity: .85 } 13% { opacity: 1 } 47% { opacity: .9 } 71% { opacity: .97 }
  }
  @media (prefers-reduced-motion: reduce) { #crt::before { animation: none } }
  #msg {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: min(90vw, 640px); font-size: 24px; line-height: 1.3; white-space: pre-wrap;
    text-shadow: 0 0 6px var(--glow);
  }
  #msg:empty { display: none }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: pre-wrap;
  }
</style>
</head>
<body>
<canvas id="screen" aria-hidden="true"></canvas>
<div id="crt"></div>
<div id="msg">LADATAAN...</div>
<pre id="sr" class="sr-only" aria-live="polite"></pre>
<noscript><p>Koodisampo Terminal tarvitsee JavaScriptin ja WebGL 2:n.</p></noscript>

<script src="./koodisampo-terminal.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
