<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var force = params.get("mobile");
      if (force === "1" || force === "true") {
        document.documentElement.classList.add("mobile-layout");
        return;
      }
      if (force === "0" || force === "false") return;
      var w = (window.visualViewport && window.visualViewport.width) || document.documentElement.clientWidth || window.innerWidth;
      if (w <= 768 || window.matchMedia("(hover: none) and (pointer: coarse)").matches) {
        document.documentElement.classList.add("mobile-layout");
      }
    })();
  </script>
  <title>Koodisampo</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("koodisampo-theme");
        if (t === "slate-light" || t === "slate" || t === "slate-dark") {
          document.documentElement.dataset.theme = t;
        } else {
          document.documentElement.dataset.theme = "slate";
        }
      } catch (e) {
        document.documentElement.dataset.theme = "slate";
      }
    })();
  </script>
  <style>
    :root,
    [data-theme="slate"] {
      --bg: #121a26;
      --surface: #1a2433;
      --surface-raised: #243044;
      --border: #2d3d52;
      --text: #c9d4e3;
      --text-muted: #7d8fa6;
      --text-bright: #e2eaf4;
      --overlay-bg: rgba(18, 26, 38, 0.92);
      --input-bg: #0e1520;
      --accent-blue: #58a6ff;
      --accent-cyan: #39c5cf;
      --accent-green: #3fb950;
      --accent-orange: #f0883e;
      --accent-red: #f85149;
      --accent-purple: #d2a8ff;
      --accent-yellow: #e3b341;
      --btn-primary-bg: #238636;
      --btn-primary-border: #2ea043;
      --npc-recommended-bg: #1a3d2e;
      --npc-recommended-text: #7ee787;
    }
    [data-theme="slate-light"] {
      --bg: #1e2a3a;
      --surface: #283648;
      --surface-raised: #334456;
      --border: #44566b;
      --text: #d8e2ef;
      --text-muted: #94a3b8;
      --text-bright: #eef2f8;
      --overlay-bg: rgba(30, 42, 58, 0.92);
      --input-bg: #182230;
    }
    [data-theme="slate-dark"] {
      --bg: #0a1018;
      --surface: #111a26;
      --surface-raised: #172030;
      --border: #1e2a3a;
      --text: #b4c2d4;
      --text-muted: #64748b;
      --text-bright: #d4dce8;
      --overlay-bg: rgba(10, 16, 24, 0.94);
      --input-bg: #080d14;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: ui-monospace, Menlo, monospace;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      font-size: 14px;
    }
    #app { min-height: 100%; }
    h1 { font-size: 1rem; color: var(--accent-blue); margin: 0; }
    #top-bar { margin-bottom: 8px; }
    #top-bar-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .theme-picker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .theme-picker select {
      font: inherit;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    #hud-stats { display: none; gap: 10px; flex-wrap: wrap; color: var(--text-muted); font-size: 12px; }
    #hud-stats .salary { color: var(--accent-green); font-weight: bold; }
    #hud-stats .hud-warn { color: var(--accent-red); font-weight: bold; }
    #hud-stats .hud-floor { color: var(--accent-cyan); }
    #message-bar {
      display: none;
      color: var(--text-bright);
      font-size: 13px;
      line-height: 1.35;
      margin-bottom: 6px;
      min-height: 1.2em;
    }
    #action-bar {
      display: none;
      color: var(--accent-orange);
      font-size: 14px;
      line-height: 1.4;
      margin-top: 8px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      min-height: 1.4em;
      text-align: center;
    }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    #game-area { display: flex; gap: 16px; flex: 1; min-height: 0; }
    #main { flex: 1; min-width: 420px; max-width: 720px; }
    #map-wrap { min-height: 0; }
    #map {
      background: var(--surface);
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      line-height: 1.25;
      white-space: pre-wrap;
    }
    #map .map-grid { margin: 0; }
    .iso-map-host {
      position: relative;
      width: 100%;
      min-height: 280px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--bg);
      border-radius: 4px;
    }
    .iso-map-canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #map .map-emoji {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", emoji, sans-serif;
      display: inline-block;
      width: 1.25em;
      text-align: center;
      vertical-align: -0.08em;
    }
    #map .map-eaten {
      display: inline-block;
      width: 0;
      overflow: hidden;
      vertical-align: bottom;
    }
    #map .police { background: #000; color: #fff; font-weight: bold; }
    #map .npc-recommended { background: var(--npc-recommended-bg); color: var(--npc-recommended-text); font-weight: bold; border-radius: 2px; }
    #panel { flex: 1; min-width: 280px; }
    pre { background: var(--surface); padding: 12px; border-radius: 6px; overflow: auto; max-height: 40vh; font-size: 11px; }
    .status { color: var(--accent-orange); margin: 8px 0; }
    .warn { color: var(--accent-red); font-weight: bold; }
    button {
      background: var(--surface-raised);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      margin: 2px;
      cursor: pointer;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      touch-action: manipulation;
    }
    button:hover { background: var(--border); }
    button.danger { color: var(--accent-red); border-color: color-mix(in srgb, var(--accent-red) 40%, transparent); }
    button.muted { color: var(--text-muted); }
    button.ai { color: var(--accent-purple); }
    .hint { color: var(--text-muted); font-size: 12px; margin-top: 8px; line-height: 1.5; }
    .banner { color: var(--accent-cyan); font-weight: bold; margin-bottom: 12px; white-space: pre; font-size: 12px; }
    .stats { color: var(--text-muted); margin-bottom: 12px; }
    .stats .salary { color: var(--accent-green); font-weight: bold; }
    .entity { margin-bottom: 12px; }
    .entity-char { color: var(--accent-purple); font-weight: bold; }
    .entity-name { color: var(--accent-yellow); font-weight: bold; }
    .greeting { margin: 12px 0; line-height: 1.5; }
    .choice { margin: 6px 0; }
    .choice-num { color: var(--accent-yellow); }
    .divider { color: var(--text-muted); margin: 14px 0 8px; }
    .side-opt { margin: 4px 0; }
    .side-key { font-weight: bold; }
    .side-key.ai { color: var(--accent-purple); }
    .side-key.joke { color: var(--accent-cyan); }
    .side-key.meh, .side-key.leave { color: var(--text-muted); }
    .side-key.attack { color: var(--accent-red); font-weight: bold; }
    .attack-warn { color: var(--accent-red); }
    .overlay-title { font-weight: bold; margin-bottom: 8px; }
    .overlay-title.ok { color: var(--accent-green); }
    .overlay-title.bad { color: var(--accent-red); }
    .overlay-title.ai { color: var(--accent-purple); }
    .teaching { color: var(--text-muted); margin-top: 12px; line-height: 1.5; }
    .teaching h4 { color: var(--text-muted); margin: 0 0 6px; font-size: 12px; }
    .banter-line { margin: 8px 0; }
    .banter-you { color: var(--accent-yellow); }
    .banter-npc { color: var(--accent-purple); }
    .toolbar { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 2px; }
    .toolbar-label { width: 100%; color: var(--text-muted); font-size: 11px; margin-top: 4px; }

    .profile-setup {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--overlay-bg);
    }
    .profile-setup[hidden] { display: none !important; }
    .profile-setup-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .profile-setup-card h2 {
      margin: 0;
      color: var(--accent-blue);
      font-size: 1.1rem;
    }
    .profile-setup-lead, .profile-setup-hint {
      margin: 0;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .profile-setup-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--text);
      font-size: 13px;
    }
    .profile-setup-field input,
    .profile-setup-field select {
      font: inherit;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
    }
    .profile-setup-submit {
      margin-top: 4px;
      padding: 10px 14px;
      background: var(--btn-primary-bg);
      border-color: var(--btn-primary-border);
      color: #fff;
      font-weight: bold;
      width: 100%;
    }
    .profile-setup-error {
      margin: 0;
      color: var(--accent-red);
      font-size: 13px;
      line-height: 1.4;
    }

    /* ── Mobile: pelkistetty pelinäkymä ── */
    @media (max-width: 768px) {
      body { padding: 0; overflow: hidden; }
      #app {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) minmax(150px, 26dvh);
        height: 100dvh;
        max-height: 100dvh;
      }
      html.mobile-layout.mobile-text-choices #app,
      html.mobile-layout.mobile-toolbar-hidden #app {
        grid-template-rows: auto auto minmax(0, 1fr);
      }
      h1 { font-size: 0.7rem; margin: 0; padding: 6px 10px 0; }
      #top-bar-inner { justify-content: space-between; padding: 0 10px; gap: 8px; margin-bottom: 0; }
      .theme-picker { font-size: 10px; }
      .theme-picker select { font-size: 10px; padding: 3px 6px; max-width: 9.5rem; }
      .theme-picker-label { display: none; }
      #top-bar { padding: 0; margin: 0; border-bottom: 1px solid var(--border); }
      #hud-stats { display: flex; padding: 4px 10px 6px; }
      #message-bar { display: block; padding: 4px 10px; border-bottom: 1px solid var(--border); margin: 0; font-size: 12px; color: var(--text-bright); }
      #action-bar { display: block; padding: 6px 10px; margin: 0; border-top: 1px solid var(--border); font-size: 13px; text-align: center; }
      .row { display: contents; }
      #game-area { overflow: hidden; min-height: 0; }
      #main {
        min-width: 0;
        max-width: none;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 0;
        min-height: 0;
      }
      #map-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        overflow: hidden;
        padding: 0;
        min-height: 0;
      }
      #map-wrap.map-play-view {
        justify-content: flex-start;
        overflow: hidden;
      }
      #map-wrap.map-play-view #map {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        overflow: hidden;
      }
      #map-wrap.map-play-view [data-map-shell] {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        max-height: 100%;
        overflow: hidden;
        flex-shrink: 0;
      }
      #map-wrap.map-play-view [data-map-grid] {
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        border: none;
        flex: 1;
        min-height: 180px;
        overflow: hidden;
      }
      #map-wrap.map-play-view [data-map-grid] .map-rows,
      #map-wrap.map-play-view [data-map-grid] [data-map-rows] {
        display: inline-block;
        text-align: left;
        vertical-align: top;
        max-width: 100%;
      }
      #map-wrap.map-play-view [data-map-grid] [data-map-row] {
        display: block;
        white-space: pre;
        font-family: inherit;
        font-size: inherit;
        line-height: inherit;
        letter-spacing: inherit;
      }
      #map-wrap.map-play-view [data-map-header] {
        flex-shrink: 0;
        width: 100%;
        padding: 4px 8px 2px;
      }
      #map-wrap.map-play-view [data-map-hint] {
        display: none;
      }
      #mobile-elevator {
        flex-shrink: 0;
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }
      #mobile-elevator[hidden] {
        display: none !important;
      }
      #mobile-elevator .elevator-expand {
        width: 100%;
        min-height: 36px;
        margin: 0;
        color: var(--accent-cyan);
        border-color: color-mix(in srgb, var(--accent-cyan) 40%, transparent);
      }
      #mobile-elevator .elevator-label {
        color: var(--accent-cyan);
        font-size: 0.7rem;
        text-align: center;
        width: 100%;
        margin-bottom: 4px;
      }
      #mobile-elevator .elevator-grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
      }
      #mobile-elevator .elevator-row {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        width: 100%;
      }
      #mobile-elevator .elevator-btn {
        min-height: 44px;
        margin: 0;
        padding: 0;
        font-size: 1rem;
        font-weight: bold;
        width: 100%;
      }
      #mobile-elevator .elevator-btn.current {
        border-color: var(--accent-cyan);
        color: var(--accent-cyan);
        background: var(--surface);
      }
      #mobile-elevator .elevator-btn.disabled {
        opacity: 0.45;
      }
      #mobile-dpad {
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        padding: 6px 12px 4px;
        border-top: 1px solid var(--surface-raised);
      }
      #mobile-dpad[hidden] {
        display: none !important;
      }
      #mobile-dpad .dpad {
        display: grid;
        grid-template-columns: repeat(3, 52px);
        gap: 6px;
        width: max-content;
      }
      #mobile-dpad .dpad-btn {
        min-height: 52px;
        min-width: 52px;
        font-size: 1.45rem;
        margin: 0;
        padding: 0;
      }
      #mobile-dpad .dpad span {
        width: 52px;
        height: 52px;
      }
      #map-wrap.map-text-view {
        align-items: stretch;
        justify-content: flex-start;
        padding: 0;
      }
      #map-wrap.map-text-view #map {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #map-wrap.map-text-view #map .map-scroll {
        flex: 1;
        min-height: 0;
      }
      #map {
        border: none;
        border-radius: 0;
        padding: 0;
        margin: 0;
        background: transparent;
        overflow: hidden;
        max-width: 100%;
        width: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #map .map-grid {
        font-size: inherit;
        white-space: pre;
        line-height: 1.05;
      }
      #map.encounter-view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #map .map-scroll {
        flex: 1;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        width: 100%;
        padding: 8px 10px;
        overflow-wrap: break-word;
        word-break: break-word;
        line-height: 1.45;
      }
      html.mobile-layout.mobile-text-choices #map .map-scroll {
        padding: 10px 12px calc(16px + env(safe-area-inset-bottom));
      }
      #map .map-scroll .touch-choice {
        display: block;
        margin: 6px 0;
        padding: 12px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      #map .map-scroll .touch-choice:active {
        background: var(--surface-raised);
      }
      #map .map-scroll .touch-choice.touch-continue {
        margin-top: 16px;
        text-align: center;
        color: var(--accent-cyan);
        font-weight: bold;
      }
      #map .map-scroll .touch-choice.muted {
        color: var(--text-muted);
      }
      #map .map-scroll .greeting,
      #map .map-scroll .choice,
      #map .map-scroll .side-opt,
      #map .map-scroll .entity,
      #map .map-scroll .teaching,
      #map .map-scroll .banter-line {
        overflow-wrap: break-word;
        word-break: break-word;
      }
      #hint { display: none !important; }
      #panel { display: none !important; }
      #toolbar {
        margin: 0;
        border-top: 1px solid var(--border);
        background: var(--bg);
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
        align-content: end;
        min-height: 0;
      }
      html.mobile-layout.mobile-text-choices #toolbar,
      html.mobile-layout.mobile-toolbar-hidden #toolbar {
        display: none !important;
      }
      #toolbar.toolbar-mobile {
        display: flex;
        flex-direction: column;
        gap: 6px;
        justify-content: flex-end;
        overflow: hidden;
        min-height: 0;
      }
      #toolbar .action-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        min-width: 0;
        width: 100%;
      }
      #toolbar .action-row button {
        min-height: 42px;
        margin: 0;
        padding: 4px 2px;
        font-size: 0.7rem;
        line-height: 1.15;
      }
      #toolbar.toolbar-stack {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      #toolbar.toolbar-stack button {
        min-height: 44px;
        margin: 0;
        font-size: 0.85rem;
      }
      .mobile-hide { display: none !important; }
      #debug-json-toggle { display: none !important; }
    }

    /* Kun JS asettaa mobile-layout-luokan (@media ei osu DevToolsissa) */
    html.mobile-layout body { padding: 0; overflow: hidden; }
    html.mobile-layout #app {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) minmax(150px, 26dvh);
      height: 100dvh;
      max-height: 100dvh;
      max-width: none;
      margin: 0;
    }
    html.mobile-layout #hud-stats { display: flex; padding: 4px 10px 6px; }
    html.mobile-layout #message-bar { display: block; padding: 4px 10px; border-bottom: 1px solid var(--border); margin: 0; font-size: 12px; color: var(--text-bright); }
    html.mobile-layout #action-bar { display: block; padding: 6px 10px; margin: 0; border-top: 1px solid var(--border); font-size: 13px; text-align: center; }
    html.mobile-layout .row { display: contents; }
    html.mobile-layout #main { min-width: 0; max-width: none; display: flex; flex-direction: column; overflow: hidden; padding: 0; min-height: 0; }
    html.mobile-layout #panel { display: none !important; }
    html.mobile-layout #hint { display: none !important; }
    html.mobile-layout #mobile-dpad:not([hidden]) { display: flex; }

    @media (min-width: 769px) {
      html:not(.mobile-layout) body {
        padding: 12px 16px 20px;
      }
      html:not(.mobile-layout) #app {
        max-width: 960px;
        margin: 0 auto;
      }
      html:not(.mobile-layout) #hud-stats {
        display: flex;
        justify-content: center;
      }
      html:not(.mobile-layout) #message-bar {
        display: block;
        text-align: center;
        margin-bottom: 6px;
        color: var(--text-bright);
      }
      html:not(.mobile-layout) #action-bar {
        display: block;
        text-align: center;
        max-width: 780px;
        margin: 8px auto 0;
        width: 100%;
      }
      html:not(.mobile-layout) #toolbar.toolbar-desktop .elevator-panel {
        width: 100%;
        margin-top: 8px;
      }
      html:not(.mobile-layout) #toolbar .elevator-expand {
        width: 100%;
        color: var(--accent-cyan);
        border-color: color-mix(in srgb, var(--accent-cyan) 40%, transparent);
      }
      html:not(.mobile-layout) #toolbar .elevator-label {
        color: var(--accent-cyan);
        font-size: 12px;
        width: 100%;
        margin-bottom: 6px;
      }
      html:not(.mobile-layout) #toolbar .elevator-grid {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
      }
      html:not(.mobile-layout) #toolbar .elevator-row {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 4px;
        width: 100%;
        max-width: 320px;
      }
      html:not(.mobile-layout) #toolbar .elevator-btn {
        min-height: 36px;
        font-weight: bold;
      }
      html:not(.mobile-layout) #toolbar .elevator-btn.current {
        background: var(--btn-primary-bg);
        border-color: var(--accent-green);
      }
      html:not(.mobile-layout) #toolbar .elevator-btn.disabled {
        opacity: 0.35;
      }
      #top-bar {
        text-align: center;
        margin-bottom: 4px;
      }
      #game-area {
        flex-direction: column;
        align-items: center;
      }
      #main {
        flex: none;
        width: 100%;
        max-width: 820px;
        min-width: 0;
      }
      #map-wrap.map-text-view {
        justify-content: flex-start;
        align-items: stretch;
        max-height: calc(100vh - 220px);
        overflow: hidden;
      }
      #map-wrap.map-text-view #map {
        width: 100%;
        max-width: 780px;
        margin: 0 auto;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #map-wrap.map-text-view #map .map-scroll {
        width: 100%;
        padding: 8px 16px;
        box-sizing: border-box;
      }
      #map-wrap {
        max-height: calc(100vh - 220px);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #map {
        width: 100%;
        max-width: 780px;
        margin: 0 auto;
        padding: 16px 20px;
      }
      #map .map-grid,
      #map [data-map-grid] {
        font-size: 15px;
        line-height: 1.12;
      }
      #map [data-map-rows] {
        margin: 0 auto;
      }
      #hint {
        text-align: center;
        max-width: 780px;
        margin: 10px auto 0;
      }
      #debug-json-toggle {
        display: block !important;
      }
      body.show-debug-json #debug-json-toggle {
        display: none !important;
      }
      #panel.debug-panel {
        display: none;
        width: 100%;
        max-width: 820px;
        margin: 16px auto 0;
      }
      body.show-debug-json #panel.debug-panel {
        display: block;
      }
      #status {
        display: none;
      }
      #map.encounter-view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 180px);
      }
      #map .map-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding-right: 4px;
      }
      #map [data-map-shell] {
        display: flex;
        flex-direction: column;
        min-height: 0;
        max-height: calc(100vh - 180px);
      }
      #map [data-map-grid] {
        flex: 1;
        min-height: 240px;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <div id="top-bar-inner">
        <h1>Koodisampo</h1>
        <label id="theme-picker" class="theme-picker" title="Valitse taustateema">
          <span class="theme-picker-label">Teema</span>
          <select id="theme-select" aria-label="Taustateema"></select>
        </label>
      </div>
      <div id="hud-stats"></div>
    </header>
    <div id="message-bar" hidden></div>
    <div class="row">
      <div id="game-area">
        <div id="main">
          <div id="map-wrap">
            <div id="map">ladataan…</div>
          </div>
          <div id="action-bar" hidden></div>
          <div id="mobile-elevator" hidden></div>
          <div id="mobile-dpad" hidden></div>
          <div class="hint" id="hint"></div>
          <button type="button" id="debug-json-toggle" class="muted" style="display:block;margin:8px auto 0;font-size:11px;padding:4px 10px">Näytä JSON</button>
        </div>
        <aside id="panel" class="debug-panel">
          <div style="color:var(--text-muted);font-size:11px;margin-bottom:8px">Debug snapshot (` näppäin tai ?debug=1)</div>
          <div id="meta"></div>
          <div id="status" class="status"></div>
          <pre id="json"></pre>
        </aside>
      </div>
    </div>
    <footer id="toolbar" class="toolbar"></footer>
  </div>
  <div id="profile-setup" class="profile-setup" hidden>
    <form id="profile-setup-form" class="profile-setup-card">
      <h2>Tervetuloa Koodisampoon</h2>
      <p class="profile-setup-lead">Kerro kuka olet — kollegat tervehtivät sinua nimelläsi.</p>
      <label class="profile-setup-field">
        <span>Nimesi</span>
        <input id="profile-name" name="name" type="text" maxlength="24" autocomplete="nickname" placeholder="esim. Pekka" required />
      </label>
      <label class="profile-setup-field">
        <span>Erikoisosaaminen</span>
        <select id="profile-specialty" name="specialty" required></select>
      </label>
      <p class="profile-setup-hint">Kysymykset painottuvat valitsemaasi osaamiseen.</p>
      <p id="profile-setup-error" class="profile-setup-error" hidden></p>
      <button type="button" id="profile-start-btn" class="profile-setup-submit">Aloita peli</button>
    </form>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
